        function initRewriteProgression(container, steps, prefixes) {
            if(!container) return;
            let currentStep = 0;
            let animating = false;
            const mainEl = container.querySelector('.rewrite-main');
            const prefixEl = container.querySelector('.rewrite-prefix');

            async function eraseSlot(slot, text, keepLength = 0) {
                slot.classList.add('active');
                const plainText = slot.textContent;
                for (let i = plainText.length; i >= keepLength; i--) {
                slot.textContent = plainText.substring(0, i);
                await new Promise(r => setTimeout(r, 40));
                }
            }

            async function typeSlot(slot, text, keepLength = 0, isChanged = false) {
                const prefixText = text.substring(0, keepLength);
                const suffixText = text.substring(keepLength);
                
                for (let i = 0; i <= suffixText.length; i++) {
                    if (isChanged && keepLength > 0) {
                        slot.innerHTML = prefixText + '<span class="changed">' + suffixText.substring(0, i) + '</span>';
                    } else {
                        slot.textContent = text.substring(0, keepLength + i);
                    }
                    await new Promise(r => setTimeout(r, 50));
                }
                slot.classList.remove('active');
                if (isChanged && keepLength === 0) {
                    slot.classList.add('changed');
                }
            }

            async function transitionTo(stepIdx) {
                animating = true;
                const step = steps[stepIdx];
                const prevStep = steps[stepIdx - 1];

                const slots = mainEl.querySelectorAll('.rw-slot');
                slots.forEach(slot => {
                    slot.classList.remove('changed');
                    slot.innerHTML = slot.textContent; // Rensa eventuella inre färg-markeringar från förra steget
                });

                if (prefixEl && prefixes[stepIdx - 1]) {
                prefixEl.textContent = prefixes[stepIdx - 1];
                prefixEl.classList.add('visible');
                await new Promise(r => setTimeout(r, 800));
                }

                for (const slot of slots) {
                const key = slot.dataset.key;
                const prev = prevStep[key] || "";
                const curr = step[key] || "";
                if (prev !== curr) {
                    let commonLen = 0;
                    while(commonLen < prev.length && commonLen < curr.length && prev[commonLen] === curr[commonLen]) {
                        commonLen++;
                    }
                    await eraseSlot(slot, prev, commonLen);
                    await new Promise(r => setTimeout(r, 200));
                    await typeSlot(slot, curr, commonLen, true);
                }
                }

                await new Promise(r => setTimeout(r, 600));
                if (prefixEl) prefixEl.classList.remove('visible');
                animating = false;
            }

            window.handleNextStep = () => {
                if (animating) return true;
                if (currentStep < steps.length - 1) {
                    currentStep++;
                    transitionTo(currentStep);
                    return true;
                }
                return false;
            };
            
            container.onclick = function(e) {
                if (window.handleNextStep && !window.handleNextStep()) {
                    nextSlide();
                }
            };
        }

        function typewriterHtml(container, htmlString) {
            let i = 0;
            let isTag = false;
            let currentHTML = "";
            container.innerHTML = '<span class="cursor"></span>';
            // We use a simple tag to ensure we don't double-animate
            const animationId = Date.now();
            container.dataset.animId = animationId;

            function typeNext() {
                // Stop if a new animation started
                if (container.dataset.animId != animationId) return;
                // Stop if slide is closed
                if (document.getElementById('slideView').style.display === 'none') return;
                
                if (i < htmlString.length) {
                    if (htmlString[i] === '<') isTag = true;
                    
                    currentHTML += htmlString[i];
                    i++;

                    if (isTag) {
                        if (htmlString[i-1] === '>') {
                            isTag = false;
                            container.innerHTML = currentHTML + '<span class="cursor"></span>';
                            // Scroll if it was a line break
                            if (htmlString.substring(i-4, i) === '<br>' || htmlString.substring(i-5, i) === '<br/>') {
                                const cursorObj = container.querySelector('.cursor');
                                if (cursorObj) cursorObj.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }
                            setTimeout(typeNext, 5);
                        } else {
                            typeNext();
                        }
                    } else {
                        container.innerHTML = currentHTML + '<span class="cursor"></span>';
                        // Keep cursor roughly centered as it types long paragraphs
                        if (i % 30 === 0) {
                            const cursorObj = container.querySelector('.cursor');
                            if (cursorObj) cursorObj.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                        setTimeout(typeNext, 20 + Math.random() * 15);
                    }
                } else {
                    container.innerHTML = currentHTML;
                }
            }
            setTimeout(typeNext, 200);
        }

        let timerInterval = null;
        window.startTimer = function(inputId, displayId, digitsId, overlayId) {
            let timeStr = document.getElementById(inputId).value.replace(/[^0-9:]/g, '');
            if (!timeStr) return;
            
            // Allow fast typing like "1430" without the colon
            if (timeStr.length === 4 && !timeStr.includes(':')) {
                timeStr = timeStr.substring(0, 2) + ':' + timeStr.substring(2);
            } else if (timeStr.length === 3 && !timeStr.includes(':')) {
                timeStr = timeStr.substring(0, 1) + ':' + timeStr.substring(1);
            }

            const parts = timeStr.split(':');
            const hours = parseInt(parts[0], 10) || 0;
            const minutes = parseInt(parts[1], 10) || 0;
            
            const now = new Date();
            const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hours, minutes, 0, 0);
            
            // If target is in the past, assume tomorrow
            if (target < now) {
                target.setDate(target.getDate() + 1);
            }

            document.getElementById(inputId).parentElement.style.display = 'none';
            const displayEl = document.getElementById(displayId);
            displayEl.style.display = 'flex';
            
            const digitsEl = document.getElementById(digitsId);
            const overlayEl = document.getElementById(overlayId);
            const overlayText = overlayEl.querySelector('.timer-fullscreen-text');

            if (timerInterval) clearInterval(timerInterval);
            
            function showOverlay(text, duration) {
                overlayText.textContent = text;
                overlayEl.classList.add('visible');
                if (duration) {
                    setTimeout(() => overlayEl.classList.remove('visible'), duration);
                }
            }

            let triggeredMilestones = {};

            function update() {
                const diff = target - new Date();
                if (diff <= 0) {
                    clearInterval(timerInterval);
                    digitsEl.textContent = "00:00";
                    showOverlay("Nu fortsätter vi! 😊", 0);
                    return;
                }
                
                const totalSeconds = Math.floor(diff / 1000);
                const m = Math.floor(totalSeconds / 60);
                const s = totalSeconds % 60;
                
                digitsEl.textContent = m.toString().padStart(2, '0') + ':' + s.toString().padStart(2, '0');
                
                const checkMilestone = (min, text) => {
                    if (totalSeconds <= min * 60 && !triggeredMilestones[min]) {
                        triggeredMilestones[min] = true;
                        // Only show if we are within 15 seconds of the milestone (prevents old milestones from firing immediately on start)
                        if (totalSeconds >= min * 60 - 15) {
                            showOverlay(text, 10000);
                        }
                    }
                };

                checkMilestone(10, "10 minuter kvar till återsamling");
                checkMilestone(5, "5 minuter kvar till återsamling");
                checkMilestone(4, "4 minuter kvar");
                checkMilestone(3, "3 minuter kvar");
                checkMilestone(2, "2 minuter kvar");
                checkMilestone(1, "1 minut kvar!");
            }
            update();
            timerInterval = setInterval(update, 1000);
        };

                span.textContent = (word === '.' ? '' : ' ') + word;
                span.classList.add('visible');
                selectedWords.push(word);
                tokenStep++;

                if (tokenStep >= 3) {
                    document.getElementById('tokenOptions').style.display = 'none';
                    document.getElementById('tokenCursor').style.display = 'none';
                    document.getElementById('tokenExplanation').innerHTML = '<strong>✨ Klart!</strong><br><br>Så fungerar Generativ AI: den räknar ut nästa ord baserat på matematiska sannolikheter från sin träningsdata (tex. Lgr22). <em>Varje ord du valde ändrade kontexten för nästa gissning</em> — men är det hela sanningen?';
                } else {
                    // Show next set of options based on what was just selected
                    setTimeout(() => {
                        const nextOpts = tokenTree[word] || tokenTree['lärande'];
                        const container = document.getElementById('tokenOptions');
                        container.innerHTML = nextOpts.map(o =>
                            `<div class="option" onclick="selectToken(this,'${o.word}')">${o.word} <span class="probability">${o.prob}</span></div>`
                        ).join('');
                        document.getElementById('tokenExplanation').innerHTML = `<strong>Bra!</strong> Du valde "<em>${word}</em>" — nu har kontexten ändrats och gissningsmaskinen beräknar nya sannolikheter.`;
                    }, 300);
                }
        }

        function resetTokenDemo() {
            tokenStep = 0;
            selectedWords = [];
            ['w1', 'w2', 'w3'].forEach(id => {
                const el = document.getElementById(id);
                if (el) { el.textContent = ''; el.classList.remove('visible'); }
            });
            const cursor = document.getElementById('tokenCursor');
            const opts = document.getElementById('tokenOptions');
            if (cursor) cursor.style.display = 'inline-block';
            if (opts) {
                opts.style.display = 'flex';
                opts.innerHTML = tokenTree.start.map(o =>
                    `<div class="option" onclick="selectToken(this,'${o.word}')">${o.word} <span class="probability">${o.prob}</span></div>`
                ).join('');
            }
            const expl = document.getElementById('tokenExplanation');
            if (expl) expl.innerHTML = '<strong>👆 Klicka på ett ord!</strong><br>AI:n ser prompten och beräknar matematiskt sannolikheten för varje möjligt nästa ord baserat på t.ex. Lgr22.';
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            
            if (!document.getElementById('slideView').classList.contains('active')) return;
            
            if (e.key === 'Escape') {
                closeSlide();
            } else if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                if (window.handleNextStep && window.handleNextStep()) return;
                nextSlide();
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            }
        });

        // Init
        loadSlides();
    </script>
</body>

</html>
